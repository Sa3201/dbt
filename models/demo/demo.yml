
version: 2

models:
  - name: employee
    description: "Employee DBT model"
    columns:
      - name: emp_id
        data_tests:
          - unique
          - not_null

  - name: customer
    description: "DBT Model for the customer table"

  - name: customer_vw
    description: "DBT Model for the customer view"

  - name: sales
    description: "Sales table"

  - name: product
    description: "Product table"

  - name: purchase
    description: "Purchase table"

  - name: clean_orders
    description: "Ephemeral model"

  - name: final_orders
    description: "Final orders model"

  - name: session
    description: "DBT Model for the session table"
  
  - name: concat_name
    description: "DBT Model for the concat name"
    
  - name: concat_address
    description: "DBT Model for the concat address"


sources:
